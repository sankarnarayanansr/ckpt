# .github/workflows/release.yml
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04   # → ckpt-linux-x86_64
          - os: macos-14       # → ckpt-macos-arm64  (Apple Silicon)
          - os: windows-2022   # → ckpt-windows.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install click rich pyinstaller
      - run: pyinstaller ckpt.spec --clean --noconfirm
      - name: rename binary
        run: mv dist/ckpt dist/ckpt-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ runner.os }}
          path: dist/ckpt-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with: { files: '**/*' }