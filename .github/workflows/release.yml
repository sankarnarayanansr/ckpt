# .github/workflows/release.yml
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          # Use older Ubuntu for maximum backward compatibility across Linux distros
          - os: ubuntu-20.04   
            name: linux-x86_64
          # Intel-based Macs
          - os: macos-13       
            name: macos-x86_64
          # Apple Silicon (M1/M2/M3) Macs
          - os: macos-14       
            name: macos-arm64
          # Windows
          - os: windows-2022   
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
        
      - run: pip install click rich pyinstaller
      
      - run: pyinstaller ckpt.spec --clean --noconfirm

      # Rename step for Linux and Mac
      - name: Rename binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/ckpt dist/ckpt-${{ matrix.name }}

      # Rename step for Windows (Accounts for .exe and forces bash shell)
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ckpt.exe dist/ckpt-${{ matrix.name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.name }}
          path: dist/ckpt-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with: { files: '**/*' }