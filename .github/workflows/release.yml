# .github/workflows/release.yml
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Bumped to 22.04 because 20.04 is removed from GitHub Actions
          - os: ubuntu-22.04
            name: linux-x86_64
          # Standard Apple Silicon Mac
          - os: macos-14
            name: macos-arm64
          # Standard Windows
          - os: windows-2022
            name: windows-x86_64

    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
        
      - run: pip install click rich pyinstaller
      
      - run: pyinstaller ckpt.spec --clean --noconfirm

      # Rename step for Linux and Mac
      - name: Rename binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/ckpt dist/ckpt-${{ matrix.target.name }}

      # Rename step for Windows (Accounts for .exe and forces bash shell)
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/ckpt.exe dist/ckpt-${{ matrix.target.name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.target.name }}
          path: dist/ckpt-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true
          
      - uses: softprops/action-gh-release@v2
        with: 
          files: release-binaries/*